[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "server-lint",
        name = "Server ESLint",
        language = "system",
        entry = "npm --prefix server run lint",
        files = "^server/",
        pass_filenames = false,
    },
    {
        id = "client-lint",
        name = "Client ESLint",
        language = "system",
        entry = "npm --prefix client run lint",
        files = "^client/",
        pass_filenames = false,
    },
    {
        id = "server-prettier",
        name = "Server Prettier",
        language = "system",
        entry = "npm --prefix server exec prettier -- --write",
        files = "^server/.*\\.(ts|tsx|js|json|css|md)$",
        pass_filenames = true,
    },
    {
        id = "client-prettier",
        name = "Client Prettier",
        language = "system",
        entry = "npm --prefix client exec prettier -- --write",
        files = "^client/.*\\.(ts|tsx|js|jsx|json|css|md)$",
        pass_filenames = true,
    },
    {
        id = "server-test",
        name = "Server Vitest",
        language = "system",
        entry = "npm --prefix server exec vitest -- run",
        files = "^server/",
        pass_filenames = false,
    },
    {
        id = "client-test",
        name = "Client Vitest",
        language = "system",
        entry = "npm --prefix client exec vitest -- run",
        files = "^client/",
        pass_filenames = false,
    },
]